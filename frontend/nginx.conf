server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA fallback — let react-router handle all client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache fingerprinted build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Optional reverse proxy to the backend so the SPA can call relative
    # paths in production too. Override `BACKEND_HOST` via an nginx
    # include/sub_filter in your orchestration if needed.
    location /apps/ {
        proxy_pass http://backend:8000/apps/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location /pumpfun/ {
        proxy_pass http://backend:8000/pumpfun/;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }
}
